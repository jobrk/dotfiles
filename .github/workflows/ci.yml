name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Stow
        run: sudo apt-get update && sudo apt-get install --yes stow

      - name: Test dotfiles
        run: ./tests/smoke.sh
