set-option -g base-index 1
set-option -g default-terminal "tmux-256color"
set-option -g escape-time 10
set-option -g mode-keys vi
set-option -g pane-base-index 1
set-option -g prefix C-a
set-option -g status-position top
set-option -ga terminal-overrides ',xterm-256color:RGB'
set-option -ga terminal-overrides ',alacritty:RGB'
# Enable synchronized output (DECSET 2026) so atomic frame updates are honoured — fixes
# flicker in TUIs (e.g. Ink apps). Requires the outer terminal to support it (Alacritty does).
set-option -as terminal-features ',*:sync'
set-option -g status-style bg=default
set-option -g status-left-length 100
set-option -g status-fg "#7f849c"
set-option -g detach-on-destroy off
set-option -g status-right '%H:%M'

unbind C-b
bind-key s choose-tree -Zs -O name

bind-key C-a last-window
bind-key g set-option status
bind-key t display-popup -E -w 80% -h 75% -d "#{pane_current_path}"

# bind-key -r k select-pane -U
# bind-key -r j select-pane -D
# bind-key -r h select-pane -L
# bind-key -r l select-pane -R

bind-key -r L resize-pane -x 100
bind-key -r H select-layout even-horizontal
bind-key -r J select-layout even-vertical

bind-key -r z switch-client -l

bind-key -r f new-window -n sessionizer '~/.local/bin/tmux-sessionizer; tmux kill-pane -t "$TMUX_PANE"'


# set -g @catppuccin_flavour 'macchiato'

if-shell "[ -f ~/.tmux.local.conf ]" "source-file ~/.tmux.local.conf"

# List of plugins
# set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
