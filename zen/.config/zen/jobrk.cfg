// Apply the primary Zen profile settings once per profile.
defaultPref("jobrk.zen.config-version", 0);

if (getPref("jobrk.zen.config-version") < 1) {
    pref("browser.newtabpage.activity-stream.system.showWeatherOptIn", false);
    pref("browser.theme.toolbar-theme", 0);
    pref("browser.translations.neverTranslateLanguages", "fr");
    pref("browser.urlbar.suggest.quicksuggest.sponsored", false);
    pref("layout.css.prefers-color-scheme.content-override", 0);
    pref("network.dns.disablePrefetch", true);
    pref("network.http.speculative-parallel-limit", 0);
    pref("network.prefetch-next", false);
    pref("sidebar.visibility", "hide-sidebar");
    pref("zen.glance.enabled", false);
    pref("zen.swipe.is-fast-swipe", false);
    pref("zen.tabs.vertical.right-side", true);
    pref("zen.theme.content-element-separation", 0);
    pref("zen.view.compact.enable-at-startup", true);
    pref("jobrk.zen.config-version", 1);
}
